$schema: "http://json-schema.org/draft-07/schema#"
title: IdentityCard
type: object
properties:
  handle: { type: string }
  full_name: { type: string }
  biometric_ref:
    type: object
    properties:
      embedding_file: { type: string }
      purpose_bound: { type: string }
      created_at_utc: { type: string }
      expires_at_utc: { type: string }
      receipt_hash: { type: string }
    required: ["embedding_file", "purpose_bound", "created_at_utc", "expires_at_utc", "receipt_hash"]
  anatomy_profile:
    type: object
    properties:
      height_cm: { type: number }
      weight_kg: { type: number }
      category: { type: string }
      physique_notes: { type: string }
  memory_refs:
    type: array
    items: { type: string }
required: ["handle", "full_name", "biometric_ref"]
