# A-FORGE Execution Intelligence Tool Registry
# SOT: ariffazil/A-FORGE — Forge Engine / Runtime Bridge
# Last verified: 2026-05-19

schema_version: "2026.05.19"
organ: A-FORGE
authority: ariffazil/A-FORGE
mcp_transport: stdio + http_bridge
mcp_endpoint: http://localhost:7071/mcp
health_endpoint: http://localhost:7071/health

# A-FORGE exposes TypeScript tools through its MCP core, not Python
runtime: nodejs_22
build_target: dist/src/

 tools:
  ReadFileTool:
    category: file_system
    owner_repo: ariffazil/A-FORGE
    runtime_surface: src/tools/FileTools.ts
    tests_present: true
    status: sealed
    description: Read file contents with optional offset/limit

  WriteFileTool:
    category: file_system
    owner_repo: ariffazil/A-FORGE
    runtime_surface: src/tools/FileTools.ts
