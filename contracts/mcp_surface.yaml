schema_version: 1
kind: arifos.mcp_surface
owner_repo: A-FORGE
status: contract
last_verified: "2026-07-01"
runtime_surface:
  primary_role: execution_substrate
  primary_port: 7071
  public_surface: ops_and_release_only
  mcp_transports:
    deployed_loopback_http_port: 7072
    local_script_http_port: 3000
    stdio_entrypoint: npm run mcp:stdio
  executor_surface:
    registered_tools: 75
    stateless_http_tools: 22
    session_required_tools: 53
    registry_sources:
      - src/interfaces/mcp/core.ts
      - src/interfaces/mcp/forgeTools.ts
      - src/interfaces/mcp/policyTools.ts
  enforcement_surface:
    pre_execution_spine:
      - src/domain/governance/aThinkGuard.ts
      - src/interfaces/mcp/policyTools.ts
      - src/domain/governance/McpPolicyGate.ts
    notes:
      - No af1/SYSTEM_PROMPT_AF1.md exists in this repository
      - AAE envelope validation is applied when an envelope is present
authority:
  owns:
    - build_release
    - deploy_health
    - rollback_plan
    - ops_cost
    - execution_receipts
  resources_owned:
    - forge://governance/floors
    - forge://approvals/pending
    - forge://memory/working
    - forge://vault/records
    - forge://vault/categories
    - forge://well/state
    - forge://execution/leases/status
    - forge://execution/reality/snapshot
    - forge://execution/receipts/recent
    - forge://execution/manifests
    - forge://execution/forge_work/pointers
  excludes:
    - final_verdict
    - constitutional_law
    - domain_truth
    - cockpit_ui
expected_tools_or_routes:
  - plan_validate
  - execution_preview
  - deployment_health
  - release_provenance
  - rollback_prepare
  - vault_receipt_append
artifact_policy:
  machine_readable: required
  human_readable: required_for_deploy
  rollback_note: required_for_production
hold_conditions:
  - deploy_without_build_test_health
  - missing_rollback_path
  - secret_or_env_change
  - irreversible_host_mutation
