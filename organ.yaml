# ═══════════════════════════════════════════════════════════════════
# ORGAN.YAML — Per-repository organ identity contract
# ═══════════════════════════════════════════════════════════════════
# One instance per repository. Must be consistent with
# AAA/federation/organs.yaml (canonical registry).
# Validated by CI: 10-pr-gate.yml → organ-boundary tests.
# ═══════════════════════════════════════════════════════════════════

schema_version: 1
organ: a-forge
repo: ariffazil/A-FORGE
role: execution_actuator
authority_ceiling: EXECUTE_AFTER_SEAL
default_branch: main

interfaces:
  mcp_manifest: contracts/mcp-surface.json
  health_schema: contracts/health.schema.json
  runtime_tools: "tools/list on :7072"

owned_domains:
  - engineering_execution
  - build_deploy
  - shell_orchestration
  - reusable_workflows
  - browser_automation

forbidden_domains:
  - constitutional_judgment
  - self_authorization
  - earth_evidence
  - capital_allocation
  - human_diagnosis
  - vault999_seal_without_prior_judge

build:
  runtime: node-22
  install: npm ci
  command: npm run build
  test: npm test
  lint: "npx tsc --noEmit"
  artifact: dist/

rollback:
  strategy: previous_verified_digest
  recovery_time_minutes: 5

witness:
  required_for: [MUTATE, IRREVERSIBLE]
  min_external_confidence: 0.5
  identity_allowlist_ref: AAA/federation/authority-matrix.yaml
