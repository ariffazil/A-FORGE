# ChatGPT Secure MCP Tunnel — A-FORGE connector
# 
# Architecture:
#   ChatGPT → OpenAI tunnel → tunnel-client → 127.0.0.1:7072/mcp (HTTP)
#
# A-FORGE MCP gateway already handles stateless OBSERVE tools.
# Verified session + lease required for MUTATE tools.
#
# DO NOT use FORGE_STDIO_ACTOR_ID=ARIF — use per-request session binding.

# Tunnel client connects to A-FORGE MCP gateway
mcp_server:
  url: "http://127.0.0.1:7072/mcp"
  transport: "streamable-http"

# Identity: chatgpt-arif is a channel principal, NOT sovereign ARIF
# Sovereign binding requires verified arifOS session + SCT
identity:
  actor_id: "chatgpt-arif"
  authority: "OBSERVE_ONLY"
  note: "Channel principal. ARIF sovereign binding requires arif_init → SCT."

# Session binding (for MUTATE tools)
session:
  init_tool: "forge_session_init"
  kernel_url: "http://127.0.0.1:8088/mcp"
  note: "Call forge_session_init(actor_id='arif') to bind sovereign ARIF session."

# Tool surface: 52 stateless + full session tools
tools:
  stateless_observe: 52
  session_required: "remaining forge_* tools"
  note: "OBSERVE works immediately. MUTATE requires forge_session_init + lease."

# P0 security gates (already enforced in code)
security:
  identity_spoofing: "BLOCKED — explicit 'stateless-client' rejected"
  anonymous_access: "BLOCKED at L1_IDENTITY"
  unverified_default: "default:observe-deny (not sovereign)"
  aae_signature: "MANDATORY when present (P0.3)"
  unknown_action: "IRREVERSIBLE by default (fail-closed)"
  local_lease_fallback: "PENDING — should be DISABLED (P0.2)"
