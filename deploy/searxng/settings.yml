# SearxNG settings — self-hosted meta search for arifOS federation
# JSON API enabled for agent consumption
# 2026-08-26: braveapi (REST) + bing + ddg — datacenter-IP-resilient engine set
use_default_settings: true

server:
  secret_key: "&{SEARXNG_SECRET}"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

outgoing:
  request_timeout: 5.0
  useragent_suffix: ""
  retries: 1
  enable_http2: true

engines:
  # braveapi: REST API (not scraper), immune to datacenter IP blocks
  - name: braveapi
    engine: braveapi
    api_key: "BSABWbaBI-sVc-i-2iCya6AcHjLQflt"
    results_per_page: 20
    disabled: false
    inactive: false

  # bing: proven working from datacenter IP
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  # duckduckgo: works intermittently from datacenter
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  # Disable engines blocked from datacenter IP
  - name: brave
    engine: brave
    disabled: true

  - name: google
    engine: google
    disabled: true

  - name: startpage
    engine: startpage
    disabled: true

  - name: wikipedia
    engine: wikipedia
    shortcut: wp

  - name: arxiv
    engine: arxiv
    shortcut: arx

redis:
  url: unix:///run/redis-searxng/redis.sock?db=0

cache:
  search_cache: true
  search_cache_ttl: 600
  search_cache_max_size: 1000

ui:
  static_use_hash: true
  default_theme: simple
  default_locale: en
