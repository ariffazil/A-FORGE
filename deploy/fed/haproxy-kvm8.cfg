# NOTE 2026-09-04: literal bearer key replaced with ${FED_LITELLM_KEY} placeholder (live key lives in mode-600 env on deploy host; live /etc/haproxy/haproxy.cfg is clean)
# HAProxy — FED Gateway (2026-08-09, fixed 03:17Z, simplified 2026-08-14)
# Binds :4000, routes to FED (:4011)
# Auth injection: all backend requests get LITELLM_MASTER_KEY
# Escape (:4012) removed 2026-08-14 — redundant backup, 683MB freed.

global
    log /dev/log local0
    maxconn 2000
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  600000
    timeout server  600000
    timeout check   15000

frontend fed_gateway
    bind *:4000
    default_backend llm_nodes

backend llm_nodes
    # Inject master key for ALL requests (not just health checks)
    # This fixes 401 for OpenClaw/Claude Code that don't send auth
    http-request set-header Authorization "Bearer ${FED_LITELLM_KEY}"

    # Health check with auth
    option httpchk GET /health/liveliness
    http-check send hdr Authorization "Bearer ${FED_LITELLM_KEY}"
    http-check expect status 200

    # Primary: Full FED proxy with 5 providers + mesh
    server fed_primary 100.64.0.5:4000 check inter 5s fall 5 rise 2

frontend searxng_gateway
    bind 100.64.0.2:8080
    default_backend searxng_local

backend searxng_local
    option httpchk GET /healthz
    http-check expect status 200
    server searxng 127.0.0.1:8080 check inter 5s fall 2 rise 2
