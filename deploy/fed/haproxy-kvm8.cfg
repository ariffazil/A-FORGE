# HAProxy — FED Gateway
# ─────────────────────────────────────────────────────────────────────────────
# Repaired 2026-09-15 (harden-20260915/model). Structure reproduces the topology
# the running haproxy master has actually been serving since 2026-09-08 01:00 —
# this file is a REPAIR, not a routing change.
#
# WHY IT WAS REPAIRED
#   The previous revision (mtime 2026-09-08 01:01) placed backend-only directives
#   (`use-server`, `server`) directly inside `frontend fed_gateway`, omitted
#   `default_backend llm_nodes`, and carried no `backend llm_nodes` block on the
#   :4000 path. `haproxy -c` therefore failed with
#       [ALERT] 'server' not allowed because frontend 'fed_gateway' has no
#               backend capability
#   which meant the NEXT reload / restart / reboot would have taken :4000 and
#   :4012 DOWN. That revision also lost the master-key literal (both
#   two `Bearer` header literals were masked to a 14-char placeholder).
#
# WHAT IS LIVE (probe-verified 2026-09-15)
#   :4000 — every request is injected with the master key and served by KVM8
#           (:4013 local litellm). New i-arif chain: deepseek-flash primary,
#           7 unique upstreams, all vision-capable.
#   :4012 — fed_zen passthrough, no injection, local :4013 only (KVM8).
#   KVM4 (100.64.0.5:4000) is a passive `backup`, never a primary.
#   KVM8 litellm :4013 is reached directly by Hermes
#   (config.yaml → custom_providers[0].base_url = http://127.0.0.1:4012/v1).
#
# NOT APPLIED — PROPOSED (needs F13 approval; changes routing behaviour)
#   Auth-conditional selection on :4000 — route requests that present their own
#   Bearer (per-seat zen virtual keys) to the DB-wired local node :4013, and
#   inject the master key only when no Authorization header is present:
#       acl has_auth req.hdr(authorization) -m found
#       use_backend llm_zen_nodes if has_auth
#       default_backend llm_nodes
#   Staged variant: haproxy.cfg.proposed-authconditional
#
# Regen of the key literal: /root/scripts/haproxy-auth-regen.sh
# Golden key source:        /etc/haproxy/fed-auth.cfg (0600)

global
    log /dev/log local0
    maxconn 2000
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  600000
    timeout server  600000
    timeout check   15000

frontend fed_gateway
    bind *:4000
    default_backend llm_nodes

backend llm_nodes
    # Inject master key for ALL requests (not just health checks).
    # This fixes 401 for OpenClaw/Claude Code that don't send auth.
    http-request set-header Authorization "Bearer sk-lit-91ae6eaadd9594df7227f8722c8ea132c8acf619416474ed"

    # Health check with auth
    option httpchk GET /health/liveliness
    http-check send hdr Authorization "Bearer sk-lit-91ae6eaadd9594df7227f8722c8ea132c8acf619416474ed"
    http-check expect status 200

    # Primary: KVM8 local litellm — new i-arif chain (DeepSeek Flash primary)
    server fed_primary 127.0.0.1:4013 check inter 5s fall 5 rise 2
    # FED proxy on KVM4 (100.64.0.5) — passive failover
    server fed_backup 100.64.0.5:4000 check inter 5s fall 5 rise 2 backup

frontend searxng_gateway
    bind 100.64.0.2:8080
    default_backend searxng_local

backend searxng_local
    option httpchk GET /healthz
    http-check expect status 200
    server searxng 127.0.0.1:8080 check inter 5s fall 2 rise 2

# ── FED ZEN passthrough (2026-09-08) ─────────────────────────
# No auth injection: seats present their own zen virtual keys.
# Backend = KVM8 LiteLLM :4013 only (DB-wired, validates virtual keys).
# KVM4 :4000 primary stays on :4000 (master-key internal path).
frontend fed_zen
    bind *:4012
    default_backend llm_zen_nodes

backend llm_zen_nodes
    option httpchk GET /health/liveliness
    server zen_local 127.0.0.1:4013 check inter 5s fall 3 rise 2
