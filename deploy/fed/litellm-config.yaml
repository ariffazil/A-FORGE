  callbacks: []
  num_retries: 2
  request_timeout: 60
  allowed_fails: 2
  cooldown_time: 60
  fallbacks_on_exceptions:
  - AuthenticationError
  - RateLimitError
  - APIConnectionError
  - BadRequestError
  - NotFoundError
  - Timeout
  - ServiceUnavailableError
  - InternalServerError
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 600
    namespace: litellm-fed
    supported_call_types:
    - acompletion
    - atext_completion
    - aembedding
