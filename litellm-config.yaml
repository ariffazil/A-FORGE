# FED DEPTH READING — measured 2026-11-23 (FI-003, F13 "sah p3", then "sah config-clean")
#
# The rung count of a group is NOT its effective depth. Read it like this:
#
#   * Every rung whose api_base is token-plan.*.qwencloudapi.com or
#     token-plan.ap-southeast-1.maas.aliyuncs.com sits on the Qwen team-owner
#     seat, which answers 429 insufficient_quota until 2026-11-30T16:00Z.
#     Those rungs are declared, not servable. They come back on their own.
#   * A group name with no servable rung AND no fallback is HARD DOWN for callers.
#
# Reconciled 2026-11-23: 121 rungs across 52 groups. The Qwen token-plan tail, the
# Groq rungs (403 Cloudflare 1010 from this host) and the Gemini group (402 prepayment credits
# depleted) were removed as dead — see the tombstones at the head of model_list.
#
# Seat state measured 2026-11-23T15:40Z (one bounded probe per seat):
#   answering 200 today : 89 rungs — MiniMax M Plan, MiMo individual MAX, DeepSeek
#                          direct, OpenRouter, Nous, MiMo platform-independent, Ollama local,
#                          Pollinations, Cloudflare Workers AI
#   quota-blocked       : 32 rungs — 
#                          ZAI_API_KEY (13 rungs): Z.AI quota exhausted, resets 2026-11-24 15:31 [2026-11-24T15:31Z]
#                          MIMO_TOKEN_PLAN_API_KEY (16 rungs): MiMo team token-plan quota exhausted, resets ~2026-12-01 [~2026-12-01]
#                          MIMO_TEAM_PLAN2_API_KEY (2 rungs): MiMo team plan2 quota exhausted, resets ~2026-12-01 [~2026-12-01]
#                          KIMI_API_KEY (1 rungs): Kimi coding-API monthly quota exhausted [next cycle]
#   still dead elsewhere : 0 rungs on seats that are neither alive nor quota-blocked
#
# Measured DOWN for callers right now:
#   fed/audio-voiceclone 429 · realtime-speech 429 (both on the MiniMax speech seat)
#   qwen3.8-max, qwen3.6-plus and qwen-auto now serve mimo-v2.6-flash / deepseek-flash directly —
#     the same served model they returned through the router fallback, with no dead rung left
#
# Re-probe after each reset above, then rewrite this block with the new numbers. Do not restore
# or prune on the date alone — probe the seat first.
# ---------------------------------------------------------------------------
