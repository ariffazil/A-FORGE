litellm_settings:
  callbacks:
  - prometheus
  num_retries: 2
  request_timeout: 60
  allowed_fails: 2
  cooldown_time: 60
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: 172.19.0.2
    port: 6379
    ttl: 600
    namespace: litellm-fed
    supported_call_types:
    - acompletion
    - atext_completion
    - aembedding
router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 2
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
  - i-arif:
    - forge-777
    - agi-333
  - apex-888:
    - i-arif
  - forge-777:
    - i-arif
    - agi-333
  - agi-333:
    - i-arif
    - forge-777
  - asi-555:
    - i-arif
  allowed_fails_policy:
    cooldown_time: 60
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: postgresql://arifos_admin:ArifPostgres2026!@127.0.0.1:5432/litellm
  otel_export: false
  drop_params: true
  telemetry: false
