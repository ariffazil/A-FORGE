litellm_settings:
  num_retries: 2
  request_timeout: 60
  allowed_fails: 1
  cooldown_time: 259200
  drop_params: true
  rpm_per_model:
    hermes-asi: 60
    opencode: 60
    codex: 60
    openclaw: 60
    agi-333: 60
    asi-555: 40
    apex-888: 20
    asi-555-vision: 30
    dispatch: 20
  global_rpm_limit: 300
  _72h_note: 'Circuit breaker: 72h cooldown. Quota-exhausted providers auto-disable. Auto-re-enable when cooldown expires.
    Persisted via Supabase DB. Arif 2026-08-04.'
router_settings:
  enable_pre_call_checks: true
  routing_strategy: usage-based-routing
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Database: SQLite local file. LiteLLM 1.90.2 master_key auth path unconditionally
  # hits the DB; without this, completions and /v1/models return 400 "No connected db."
  # SQLite is zero-config, local-only, no Postgres dependency. FED routing layer remains
  # stateless — this DB serves ONLY LiteLLM's internal auth validation.
  database_url: "sqlite:////root/.local/share/arifos/litellm.db"
  otel_export: false
  drop_params: true
  telemetry: false
