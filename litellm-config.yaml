litellm_settings:
  num_retries: 2
  request_timeout: 60
  allowed_fails: 1
  cooldown_time: 259200
  drop_params: true
  rpm_per_model:
    hermes-asi: 60
    opencode: 60
    codex: 60
    openclaw: 60
    agi-333: 60
    asi-555: 40
    apex-888: 20
    asi-555-vision: 30
    dispatch: 20
  global_rpm_limit: 300
  _72h_note: 'Circuit breaker: 72h cooldown. Quota-exhausted providers auto-disable. Auto-re-enable when cooldown expires.
    Persisted via Supabase DB. Arif 2026-08-04.'
router_settings:
  enable_pre_call_checks: true
  routing_strategy: usage-based-routing
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # DATABASE_URL intentionally NOT set. LiteLLM 1.90.2 Prisma expects PostgreSQL only.
  # Master key auth path hits DB unconditionally → completions return "No connected db."
  # This is ACCEPTED: no agent uses LiteLLM for completions. Agents use direct provider APIs.
  # LiteLLM serves as fed-health probe target + FED route metadata source. Liveliness works.
  # 2026-08-04: tried SQLite → Prisma rejects (expects postgresql://). Not fixable in v1.90.2.
  # Upgrade path: LiteLLM ≥2.x with stateless master_key support. Or accept completed limitation.
  otel_export: false
  drop_params: true
  telemetry: false
