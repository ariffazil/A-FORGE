# ═══════════════════════════════════════════════════════════════
# LiteLLM Proxy — FED FLAME FRAME
# arifOS Federation Model Routing Plane
# ═══════════════════════════════════════════════════════════════
# Architecture:
#   Tier 0 (FREE):  FLAME :18901 — RM0, no key, 12 models
#   Tier 1 (K1):    Qwen Token Plan — RM0 marginal, reasoning
#   Tier 2 (MM):    MiniMax — RM0, multimodal
#
# Fallback doctrine: K1/MM → FLAME free → last-resort
# Keys: kunci-mas.env → vault.flat.env → EnvironmentFile (systemd)
# Lock: 127.0.0.1 only, master_key required, no DB
#
# DITEMPA BUKAN DIBERI — Forged, Not Given
# ═══════════════════════════════════════════════════════════════

model_list:
  # ─── MAIN (deep reasoning) ───────────────────────────────────
  - model_name: main
    litellm_params:
      model: openai/deepseek-v4-pro
