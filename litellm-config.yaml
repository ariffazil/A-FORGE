      request_timeout: 30

litellm_settings:
  # ─── Retries (Layer 1: transient failures) ───
  num_retries: 2
  request_timeout: 30

  # ─── Circuit Breaker (Layer 3: proactive health) ───
  allowed_fails: 3
  cooldown_time: 60

  # ─── Fallback Chains (Layer 2: provider switch) ───
  # Doctrine: K1 → FLAME free → MiniMax → FLAME aggregator
  fallbacks:
    - {main: [flame-free, last-resort]}
    - {forge: [flame-free, last-resort]}
    - {auditor: [flame-free, last-resort]}
    - {planner: [flame-free, last-resort]}
    - {ops: [flame-free, last-resort]}
    - {small: [flame-free, last-resort]}

  # ─── Default fallback (catch-all) ───
  default_fallbacks: [flame-free, last-resort]

router_settings:
  enable_pre_call_checks: true
  routing_strategy: simple-shuffle

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  drop_params: true
  # LOCK: no telemetry, no phone-home
  telemetry: false
