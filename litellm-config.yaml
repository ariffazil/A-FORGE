# ═══ SETTINGS ═══
litellm_settings:
  callbacks: []
  num_retries: 2
  request_timeout: 60
  allowed_fails: 2
  cooldown_time: 300
  drop_params: true

router_settings:
  routing_strategy: usage-based-routing
  enable_pre_call_checks: true
  num_retries: 2
  allowed_fails: 2
  cooldown_time: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  otel_export: false
  drop_params: true
  telemetry: false
