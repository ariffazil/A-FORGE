model_list:
# hermes-asi (multimodal chain — mimo-v2.5 ONLY)
# 2026-08-04 audit: mimo-v2.5-pro is text-only per Xiaomi docs; including it caused
# usage-based-routing to intermittently rotate image/audio/video requests to it,
# producing silent data loss (no img_tokens) or NotFoundError. MiniMax-M3 fallback
# excluded for now — LiteLLM 1.90.2 doesn't recognize its multimodal capability.
# For deep-thinking text-only without multimodal, use a separate alias.
- model_name: hermes-asi
  litellm_params:
    model: openai/mimo-v2.5
    api_base: https://token-plan-sgp.xiaomimimo.com/v1
    api_key: os.environ/MIMO_API_KEY
    request_timeout: 45
# Codex 0.146 uses OpenAI Responses API. deepseek-v4-pro rejects Codex
# Responses until early-Aug 2026; use flash first for Responses clients.
- model_name: codex
  litellm_params:
    model: openai/deepseek-v4-flash
    api_base: https://api.deepseek.com/v1
    api_key: os.environ/DEEPSEEK_API_KEY
    request_timeout: 60
- model_name: codex
  litellm_params:
    model: openai/mimo-v2.5-pro
    api_base: https://token-plan-sgp.xiaomimimo.com/v1
    api_key: os.environ/MIMO_API_KEY
    request_timeout: 45
- model_name: codex
  litellm_params:
    model: openai/MiniMax-M3
    api_base: https://api.minimax.io/v1
    api_key: os.environ/MINIMAX_API_KEY
    request_timeout: 30
