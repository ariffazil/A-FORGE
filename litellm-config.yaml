      request_timeout: 30

litellm_settings:
  num_retries: 2
  request_timeout: 60

  # Circuit breaker: 3 fails → cooldown 60s
  allowed_fails: 3
  cooldown_time: 60

  # Rate limiting: 60 req/min per model, 300 req/min global
  rpm_per_model:
    hermes-asi: 60
    opencode: 60
    openclaw: 60
    agi-333: 60
    asi-555: 40
    apex-888: 20
    asi-555-vision: 30
    dispatch: 20
    flame-free: 30
  global_rpm_limit: 300

  # No fallbacks inside LiteLLM — agents choose models explicitly
  # Each model_name has its own provider list above (load-balanced)

router_settings:
  enable_pre_call_checks: true
  routing_strategy: usage-based-routing  # Least-busy provider first

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: null
  otel_export: false
  drop_params: true
  telemetry: false
