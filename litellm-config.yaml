model_list:

# ═══ 1. HERMES-ASI — Telegram (text+vision) ═══
- model_name: hermes-asi
  litellm_params:
    model: openai/mimo-v2.5
    api_base: https://token-plan-sgp.xiaomimimo.com/v1
    api_key: os.environ/MIMO_API_KEY
    order: 1
    input_cost_per_token: 0.00000014
    output_cost_per_token: 0.00000028
  model_info: {max_input_tokens: 1048576, max_output_tokens: 131072, mode: chat, supports_image_input: true}
- model_name: hermes-asi
  litellm_params:
    model: openai/deepseek-v4-flash
    api_base: https://api.deepseek.com/v1
    api_key: os.environ/DEEPSEEK_API_KEY
    order: 1
    input_cost_per_token: 0.00000014
    output_cost_per_token: 0.00000028
  model_info: {max_input_tokens: 1048576, max_output_tokens: 131072}
- model_name: hermes-asi
  litellm_params:
    model: openai/MiniMax-M3
    api_base: https://api.minimax.io/v1
    api_key: os.environ/MINIMAX_API_KEY
    order: 2
  model_info: {max_input_tokens: 1048576, max_output_tokens: 131072, mode: chat}
- model_name: hermes-asi
  litellm_params:
    model: openai/qwen3.8-max
    api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/DASHSCOPE_API_KEY
    order: 3
  model_info: {max_input_tokens: 1000000, max_output_tokens: 131072, mode: chat, supports_vision: true, supports_function_calling: true}
- model_name: hermes-asi
  litellm_params:
    model: openai/qwen3.7-flash
    api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/DASHSCOPE_API_KEY
    order: 4
  model_info: {max_input_tokens: 1000000, max_output_tokens: 131072}

