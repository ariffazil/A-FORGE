# ═══════════════════════════════════════════════════════════════
# LiteLLM Proxy — FED FLAME FRAME v2
# arifOS Federation Model Routing Plane
# ═══════════════════════════════════════════════════════════════
# Architecture:
#   F0 (FREE):   FLAME :18901 — RM0, always available, local
#   F1 (MIMO):   MiMo Token Plan — 1M ctx, deep reasoning
#   F2 (QWEN):   Qwen Token Plan — multimodal, Harness tools
#   F3 (MM):     MiniMax — 1M ctx flagship, stable
#   F4 (DS):     DeepSeek direct — prepaid $10.41, fastest
#   F5 (KIMI):   Kimi K3 — 2.8T MoE, last paid fallback
#   F6 (OLLAMA): Ollama local — blind survival, free
#
# Agent → Model assignments (Arif 2026-08-04):
#   hermes-asi  → MiMo V2.5 Pro (F1) → MiniMax M3 (F3) → FLAME (F0)
#   opencode    → DeepSeek V4 Pro (F4) → MiMo V2.5 (F1) → MiniMax (F3)
#   openclaw    → MiniMax M3 (F3)
#   agi-333     → DeepSeek V4 Pro (F4) → MiMo V2.5 (F1) → MiniMax (F3)
#   asi-555     → Qwen Flash (F2) → MiMo V2.5 (F1) → MiniMax (F3)
#   apex-888    → MiniMax M3 (F3) → DeepSeek V4 (F4)
#
# Rate limiting: 60 req/min per agent, 300 req/min total
# No DB. No telemetry. 127.0.0.1 only.
# DITEMPA BUKAN DIBERI — Forged, Not Given
# ═══════════════════════════════════════════════════════════════

model_list:

  # ─── HERMES-ASI — Human-facing, multimodal, MiMo primary ─────
  - model_name: hermes-asi
    litellm_params:
      model: openai/mimo-v2.5-pro
      api_base: https://token-plan-sgp.xiaomimimo.com/v1
      api_key: os.environ/MIMO_API_KEY
      request_timeout: 60
  - model_name: hermes-asi
    litellm_params:
      model: openai/MiniMax-M3
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      request_timeout: 30
  - model_name: hermes-asi
    litellm_params:
      model: openai/free-aggregator
      api_base: http://127.0.0.1:18901/v1
      api_key: "sk-flame-local"
      request_timeout: 30

