litellm_settings:
  # FED is a pure pass-through. The arifOS kernel (port 8088) is the constitutional guard.
  # No guardrails or content filters at FED level. Routing/quota/cost discipline only.
  callbacks:
  - prometheus
  num_retries: 2
  request_timeout: 60
  allowed_fails: 2
  cooldown_time: 60
  fallbacks_on_exceptions:
  - AuthenticationError
  - RateLimitError
  - APIConnectionError
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: 127.0.0.1
