litellm_settings:
  # 2026-09-21 FI-008: FedSpendCallback writes per-call to token_bank.db.
  # Container mounts callback at /app/fed_spend_callback.py and DB at /app/data/.
  # Note: must point at INSTANCE (proxy_handler_instance), not class.
  callbacks: ["fed_spend_callback.proxy_handler_instance"]
  num_retries: 2
  request_timeout: 60
  allowed_fails: 2
  cooldown_time: 60
  fallbacks_on_exceptions:
  - AuthenticationError
  - RateLimitError
  - APIConnectionError
  - BadRequestError
  - NotFoundError
  - Timeout
  - ServiceUnavailableError
  - InternalServerError
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: 100.64.0.2
    port: 6379
    password: os.environ/REDIS_FED_PASSWORD
    ttl: 1800
    namespace: litellm-fed
    supported_call_types:
    - acompletion
    - atext_completion
    - aembedding
    - completion
    - embedding
