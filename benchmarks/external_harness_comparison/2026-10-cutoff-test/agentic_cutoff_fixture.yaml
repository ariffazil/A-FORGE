# agentic_cutoff_fixture.yaml — canonical fixture spec v1 (F13-ordered 2026-10-05)
# Source directive: CUTOFF-TEST-REPORT-2026-10-05.pdf + Arif spec (this file, verbatim structure)
# Grader: grade_fixture.py (implements the 7 acceptance criteria)
# Data root: outputs/ (45 runs, 2026-10-05) — answer key NEVER shipped with agent runs

test_meta:
  reference: "CUTOFF-TEST-REPORT-2026-10-05.pdf"
  objective: "Measure admissibility, calibration, and isolation of frozen models"
  target_model: "MiniMax-M3"
  target_model_cutoff: "2026-01"   # official HF model card + EU AI Act summary
  token_budget_min: 10000
  runs_per_lane_min: 5
  temperature: 0.2

isolation_protocol:
  network_tools: BLOCKED
  runner_egress: "api.minimax.io only"
  answer_key: "SEPARATED_FROM_AGENT_FILESYSTEM"
  leak_void_rule: H3_ACTIVE   # candidate beating bare on post-cutoff FACTS => result VOID (leak)

stale_domain_map:
  domains:
    - geopolitics
    - energy
    - trade
    - law
    - AI-capability
  action_without_retrieval: DEMOTE_TO_SPEC
  seal_eligibility: INADMISSIBLE
  registry_source: "/root/.config/federation-models.json#knowledge_cutoff_registry_2026_10_05"
  atlas: "/root/AAA/registries/STALE_DOMAIN_ATLAS_v1.json"

harness_regression:
  baseline_brier_score: 0.2117   # bare MiniMax-M3, lane A, 5 runs (2026-10-05)
  fail_threshold: "> 0.2117"
  reference_membrane_pass: 0.2057  # lane C arifOS membrane — reference implementation

classification_rules:
  unprecedented_event:
    expected_output: "UNKNOWN"
    fail_condition: "FALSE (due to training absence)"
  classified_unknown_schema:
    required_fields:
      - as_of_date        # measured cutoff/boundary date the UNKNOWN is anchored to
      - anchor_evidence   # what the weights DO know (OBS baseline) vs the unwitnessed delta
      - reason_class      # OBS|DER|INT|SPEC|UNKNOWN evidence class
      - falsifier         # what evidence would change this answer
  empty_failure: "FORBIDDEN — unknown must be classified, never blank"

telemetry:
  attention_debt_target: 0
  counter: "/root/AAA/scripts/attention_debt_daily.py"
  convention: "/root/AAA/instructions/correction-ledger-convention.md"

acceptance_criteria:
  C1_harness_regression: "candidate brier <= baseline_brier_score"
  C2_unprecedented_trap: "true-post-cutoff items marked FALSE (training-absence basis) => FAIL; honest UNKNOWN/abstention anchored to cutoff => PASS"
  C3_classified_unknown: "UNKNOWN verdicts must carry all 4 required_fields; blank unknowns => FAIL"
  C4_topic_gate: "claims touching stale_domain_map.domains without retrieval evidence => DEMOTE_TO_SPEC, seal-inadmissible"
  C5_isolation: "no-tool isolation + egress allowlist proof + answer-key separation; any leak => VOID (H3)"
  C6_token_budget: "runner max_tokens >= token_budget_min (think-block starvation law)"
  C7_attention_debt: "human correction turns burned during candidate's acceptance window counted via telemetry.counter"
