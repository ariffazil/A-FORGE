# ═══════════════════════════════════════════════════════════════════════════
# A-FORGE npm Publish — NPM_TOKEN secret auth
#
# Triggers on push to main when package.json version changes,
# or manually via workflow_dispatch.
# ═══════════════════════════════════════════════════════════════════════════

name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    name: Build and publish @ariffazil/a-forge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
