# ═══════════════════════════════════════════════════════════════════════════
# AGENTIC CI — Dual-Lane Constitutional Gate (A-FORGE — TypeScript/Node)
# DITEMPA BUKAN DIBERI
# ═══════════════════════════════════════════════════════════════════════════
#
# Lane 1 — STANDARD CI: install → build → test
# Lane 2 — BIJAKSANA: entropy (ΔS), clarity (Φ), truth (Ψ), governance (Ω)
#   Uses TypeScript-native tools (tsc, Node test runner)
#
# Verdict: SEAL_READY | SABAR | HOLD

name: "🧠 Agentic CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  statuses: write

concurrency:
  group: agentic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  standard:
    name: "Lane 1 — Standard CI"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: node dist/test/AgentEngine.test.js
        continue-on-error: true

  bijaksana:
    name: "Lane 2 — BIJAKSANA ΔS Φ Ψ Ω"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci

      - name: "ΔS — Entropy (dead code + TODO)"
        id: ds
        run: |
          TODO=$(grep -r "TODO\|FIXME\|HACK" --include="*.ts" src/ 2>/dev/null | wc -l)
          DS=$TODO
          echo "value=$DS" >> $GITHUB_OUTPUT
          echo "ΔS = TODO($TODO) = $DS"

      - name: "Φ — Clarity (build health)"
        id: phi
        run: |
          if npm run build 2>/dev/null; then
            echo "value=100" >> $GITHUB_OUTPUT
            echo "Φ = 100% (clean build)"
          else
            echo "value=0" >> $GITHUB_OUTPUT
            echo "Φ = 0% (build errors)"
          fi

      - name: "Ψ — Truth (tool surface)"
        id: psi
        run: |
          TOOLS=$(grep -r "export const\|registerTool\|forge_" src/infrastructure/tools/ --include="*.ts" 2>/dev/null | wc -l)
          echo "value=$TOOLS" >> $GITHUB_OUTPUT
          echo "Ψ = $TOOLS forge tools declared"

      - name: "Ω — Governance (self-auth + zombies)"
        id: omega
        run: |
          SELF_AUTH=$(grep -r "self.*authorize\|self.*grant\|self.*approve\|bypass.*floor\|skip.*gate" --include="*.ts" src/ 2>/dev/null | grep -v "// \|DEPRECATED\|node_modules" | wc -l)
          ZOMBIE=$(grep -rn "A-AUDIT\|A-ARCHIVE" src/ --include="*.ts" 2>/dev/null | grep -v "DEPRECATED\|collapsed\|// " | wc -l)
          echo "value=$SELF_AUTH" >> $GITHUB_OUTPUT
          echo "zombie_agents=$ZOMBIE" >> $GITHUB_OUTPUT
          if [ "$SELF_AUTH" -gt 0 ] || [ "$ZOMBIE" -gt 0 ]; then
            echo "Ω = VIOLATION (self_auth=$SELF_AUTH, zombies=$ZOMBIE)"
          else
            echo "Ω = CLEAN"
          fi

  report:
    name: "📊 Agentic CI Report"
    runs-on: ubuntu-latest
    needs: [standard, bijaksana]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Generate Report
        id: report
        run: |
          STANDARD_OK="${{ needs.standard.result }}"
          DS="${{ needs.bijaksana.outputs.ds-value }}"
          PHI="${{ needs.bijaksana.outputs.phi-value }}"
          PSI="${{ needs.bijaksana.outputs.psi-value }}"
          OMEGA="${{ needs.bijaksana.outputs.omega-value }}"
          
          if [ "$STANDARD_OK" = "success" ] && [ "$PHI" = "100" ] && [ "$OMEGA" = "0" ] && [ "$DS" -lt 100 ]; then
            VERDICT="SEAL_READY"
          elif [ "$STANDARD_OK" = "success" ]; then
            VERDICT="SABAR"
          else
            VERDICT="HOLD"
          fi
          
          cat > agentic_ci_report.json << EOF
          {"organ":"A-FORGE","stack":"TypeScript/Node/Express","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}","lane_1":"$STANDARD_OK","lane_2":{"ds":$DS,"phi":$PHI,"psi":"$PSI","omega":$OMEGA},"verdict":"$VERDICT"}
          EOF
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('agentic_ci_report.json','utf8'));
            const c = r.verdict === 'SEAL_READY' ? 'success' : r.verdict === 'SABAR' ? 'neutral' : 'failure';
            await github.rest.checks.create({owner:context.repo.owner,repo:context.repo.repo,name:'Agentic CI',head_sha:context.sha,status:'completed',conclusion:c,output:{title:`A-FORGE: ${r.verdict}`,summary:`| Lane | Status |\n|------|--------|\n| Standard | ${r.lane_1} |\n| ΔS=${r.lane_2.ds} Φ=${r.lane_2.phi}% Ψ=${r.lane_2.psi} Ω=${r.lane_2.omega} |\n| **Verdict** | **${r.verdict}** |`}});
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agentic-ci-report-${{ github.sha }}
          path: agentic_ci_report.json
          retention-days: 90
