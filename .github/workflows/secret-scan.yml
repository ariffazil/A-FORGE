# ═══════════════════════════════════════════════════════════════════════════
# P2.6 — Secret Scanning Defence-in-Depth
# Runs on every push + PR. Blocks known secret patterns at CI gate.
# DITEMPA BUKAN DIBERI
# ═══════════════════════════════════════════════════════════════════════════

name: "🔒 Secret Scan"

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: "Gitleaks — Full Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for deep scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action v3 requires GITHUB_TOKEN for pull_request scans
          # (ScanPullRequest exits before scanning without it — measured on
          # run 38465321594). The action accepts NO inputs; the former
          # `args:` block was silently ignored. The default command is
          # `gitleaks detect --redact -v --exit-code=2 --report-format=sarif
          # --report-path=results.sarif`, which picks up .gitleaks.toml and
          # .gitleaksignore at the repo root. Findings still fail the job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Upload Gitleaks SARIF
        # results.sarif only exists after a scan ran (the action writes it
        # to the workspace root). Guard against zero-commit pushes where
        # the action exits before scanning; leak findings still fail the
        # Run Gitleaks step itself.
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: gitleaks

  detect-secrets:
    name: "Detect Secrets — Baseline Check"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan --all-files \
            --exclude-files 'dist/.*|deploy/rollback/.*|.*\.lock|.*\.sum' \
            > .secrets-scan.json || true

      - name: Check baseline
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets audit .secrets-scan.json
          else
            echo "No baseline found — generating reference scan only"
            cp .secrets-scan.json .secrets-scan-ref.json
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-scan-${{ github.sha }}
          path: .secrets-scan.json
          retention-days: 7

  trufflehog:
    name: "TruffleHog — Deep History Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Only run on push to main (expensive deep scan)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # 2026-09-12: trufflesecurity/trufflehog-action was removed upstream
        # ("repository not found") — the wrapper died, not the scanner. Run
        # the maintained docker image directly. Minimal flags only: the
        # action's --only-verified=false / --no-update tripped the CLI
        # parser ("unexpected false") — defaults + --since-commit + --fail
        # preserve the gate's purpose (deep diff scan, fail on findings).
        #
        # 2026-10-04 gate contract (F2-informed): the unqualified --fail
        # failed EVERY scan on 45 UNVERIFIED historical findings, while
        # TruffleHog's own live verification reports verified_secrets: 0
        # (run 37155131786). Machine census confirmed the sampled classes
        # dead: GitHub PAT ×2 → HTTP 401, Telegram bot token → 401,
        # postgres credential → rejected. Rotation debt is tracked in the
        # F13 briefing; history rewrite is out of scope (F1: sealed past).
        # New contract: --results=verified — the gate fails on LIVE
        # (verified) secrets only. NOTE: this CLI's git subcommand has no
        # --redact flag (measured: run 37155803897, "unknown long flag");
        # with zero verified findings there is nothing to print, and a
        # future verified finding should page the secret-hygiene flow
        # anyway. A newly committed live credential is still caught and
        # blocking.
        run: |
          docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:latest \
            git file:///pwd \
            --since-commit="${{ github.event.before }}" \
            --results=verified \
            --fail
