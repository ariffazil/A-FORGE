# ═══════════════════════════════════════════════════════════════════════════
# P2.6 — Secret Scanning Defence-in-Depth
# Runs on every push + PR. Blocks known secret patterns at CI gate.
# DITEMPA BUKAN DIBERI
# ═══════════════════════════════════════════════════════════════════════════

name: "🔒 Secret Scan"

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: "Gitleaks — Full Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for deep scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: false
        with:
          args: detect --source . --verbose --redact

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: gitleaks

  detect-secrets:
    name: "Detect Secrets — Baseline Check"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan --all-files \
            --exclude-files 'dist/.*|deploy/rollback/.*|.*\.lock|.*\.sum' \
            > .secrets-scan.json || true

      - name: Check baseline
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets audit .secrets-scan.json
          else
            echo "No baseline found — generating reference scan only"
            cp .secrets-scan.json .secrets-scan-ref.json
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-scan-${{ github.sha }}
          path: .secrets-scan.json
          retention-days: 7

  trufflehog:
    name: "TruffleHog — Deep History Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Only run on push to main (expensive deep scan)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog-action@v1
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified=false --no-update
