name: "Copilot Setup Steps — A-FORGE"

# Runs when this file changes (validation) and before every Copilot coding agent session
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # MUST be named exactly `copilot-setup-steps`
  copilot-setup-steps:
    name: "A-FORGE — Pre-install execution engine dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout A-FORGE
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install all npm dependencies
        run: npm ci

      - name: Build TypeScript (compile to dist/)
        run: npm run build
        env:
          NODE_ENV: ci

      - name: Verify AgentEngine loads
        run: |
          node -e "
          const { AgentEngine } = require('./dist/domain/engine/AgentEngine.js');
          console.log('[PASS] AgentEngine loaded');
          " || echo "[WARN] AgentEngine check skipped — ESM context"

      - name: Run fast smoke tests
        run: |
          node dist/test/PlanValidator.test.js || true
          node dist/test/confidence.test.js || true
          node dist/test/sense.test.js || true
        env:
          NODE_ENV: ci
          ARIFOS_ENV: ci

      - name: Print A-FORGE setup summary
        run: |
          echo "=== A-FORGE Copilot Environment Ready ==="
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo ""
          echo "Architecture (hexagonal layers):"
          echo "  domain/        — pure business logic, ports, types"
          echo "  application/   — use cases, services, orchestration"
          echo "  infrastructure/— LLM providers, vault, tools, bridges"
          echo "  interfaces/    — MCP, HTTP routes, CLI"
          echo ""
          echo "Key entry points:"
          echo "  Composition root: src/infrastructure/cli/cli.ts"
          echo "  Agent engine:     src/domain/engine/AgentEngine.ts"
          echo "  HTTP bridge:      src/interfaces/routes/"
          echo "  MCP surface:      src/interfaces/mcp/"
          echo ""
          echo "Run tests: make test"
          echo "Start:     npm start"
          echo "DITEMPA BUKAN DIBERI"
