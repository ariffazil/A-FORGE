# ═══════════════════════════════════════════════════════════════════
# 50-RUNTIME-RECONCILE — Source-to-Runtime Integrity
# ═══════════════════════════════════════════════════════════════════
# Scheduled + post-deployment verification of the golden loop:
#   source commit → artifact digest → deployed runtime → live surface
# ═══════════════════════════════════════════════════════════════════

name: "50 · Runtime Reconcile"

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      organs:
        description: 'Organs to reconcile (comma-separated, default: all)'
        required: false
        default: 'arifos,geox,wealth,well,a-forge,aaa'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'systemd/**'

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    name: "Reconcile ${{ matrix.organ }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        organ:
          - { name: arifos, port: 8088, repo: ariffazil/arifos }
          - { name: a-forge, port: 7071, repo: ariffazil/A-FORGE }
          - { name: geox, port: 8081, repo: ariffazil/geox }
          - { name: wealth, port: 18082, repo: ariffazil/wealth }
          - { name: well, port: 18083, repo: ariffazil/well }
          - { name: aaa, port: 3001, repo: ariffazil/AAA }
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.organ.repo }}
          path: ${{ matrix.organ.name }}

      - name: "Get source commit"
        id: source
        run: |
          cd ${{ matrix.organ.name }}
          SHA=$(git rev-parse --short=7 HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "📦 Source: $SHA"

      - name: "Check runtime health"
        id: health
        run: |
          # Attempt health probe — expected to fail from GitHub runner
          # This tells us the organ pattern, not live state
          echo "🔍 ${{ matrix.organ.name }} health endpoint: :${{ matrix.organ.port }}/health"
          HEALTH=$(curl -sf -m 5 "http://${{ matrix.organ.name }}.arif-fazil.com/health" 2>/dev/null || echo "UNREACHABLE_FROM_CI")
          if [ "$HEALTH" = "UNREACHABLE_FROM_CI" ]; then
            echo "⚠ GitHub runner cannot reach VPS (expected)"
            echo "runtime_sha=UNKNOWN" >> "$GITHUB_OUTPUT"
          else
            RT_SHA=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('git_commit','UNKNOWN')[:7])" 2>/dev/null || echo "UNKNOWN")
            echo "runtime_sha=$RT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: "Compare source vs runtime"
        run: |
          echo "## ${{ matrix.organ.name }} Runtime Reconciliation"
          echo ""
          echo "| Dimension | Value |"
          echo "|-----------|-------|"
          echo "| Source SHA | \`${{ steps.source.outputs.sha }}\` |"
          echo "| Source full | \`${{ steps.source.outputs.full_sha }}\` |"
          echo "| Runtime SHA | \`${{ steps.health.outputs.runtime_sha }}\` |"
          echo "| Runtime probe | ${{ matrix.organ.name }}.arif-fazil.com:${{ matrix.organ.port }}/health |"

          if [ "${{ steps.health.outputs.runtime_sha }}" != "UNKNOWN" ] && [ "${{ steps.health.outputs.runtime_sha }}" != "${{ steps.source.outputs.sha }}" ]; then
            echo ""
            echo "⚠ **DRIFT DETECTED**: source != runtime"
            echo "   Source: \`${{ steps.source.outputs.sha }}\`"
            echo "   Runtime: \`${{ steps.health.outputs.runtime_sha }}\`"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Open drift issue"
        if: steps.compare.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[DRIFT] ${{ matrix.organ.name }}: source != runtime`;
            const body = `## Runtime Drift — ${{ matrix.organ.name }}

            **Source commit:** \`${{ steps.source.outputs.sha }}\`
            **Runtime SHA:** \`${{ steps.health.outputs.runtime_sha }}\`

            The deployed runtime does not match the source commit on \`main\`.
            This may indicate:
            - A deployment was not triggered after merge
            - The deployment artifact was rebuilt (not using the attested digest)
            - The runtime was manually modified

            **Required action:** Verify deployment pipeline. Re-deploy from attested artifact if needed.

            ---
            *Auto-generated by 50-runtime-reconcile workflow*`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['runtime-drift']
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['runtime-drift', 'auto-generated']
              });
            }
