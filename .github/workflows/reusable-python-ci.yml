# ═══════════════════════════════════════════════════════════════════
# A-FORGE Reusable Python CI Workflow
# ═══════════════════════════════════════════════════════════════════
# Called by: arifos, geox, wealth, well
# Pinned by: FULL COMMIT SHA (never @main)
# ═══════════════════════════════════════════════════════════════════

name: "A-FORGE · Reusable Python CI"

on:
  workflow_call:
    inputs:
      organ:
        description: 'Organ name (arifos|geox|wealth|well)'
        required: true
        type: string
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'
      install_command:
        description: 'Install command'
        required: false
        type: string
        default: 'pip install -e ".[dev]"'
      test_command:
        description: 'Test command'
        required: false
        type: string
        default: 'pytest tests/ -q --tb=short'
      lint_command:
        description: 'Lint command'
        required: false
        type: string
        default: 'ruff check . && ruff format --check .'
      type_check_command:
        description: 'Type check command (optional)'
        required: false
        type: string
        default: ''
      artifact_path:
        description: 'Artifact path pattern'
        required: false
        type: string
        default: 'dist/*.whl'
    secrets:
      PYPI_TOKEN:
        required: false

jobs:
  # ── Classify change severity ─────────────────────────────────────
  classify:
    name: "Classify Change"
    runs-on: ubuntu-latest
    outputs:
      risk_class: ${{ steps.classify.outputs.risk_class }}
      reversibility: ${{ steps.classify.outputs.reversibility }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify
        id: classify
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD 2>/dev/null || echo "")
          RISK="LOW"
          if echo "$CHANGED" | grep -qE '(FEDERATION|CONSTITUTION|CANON|floors|organ\.yaml)'; then
            RISK="CRITICAL"
          elif echo "$CHANGED" | grep -qE '(mcp.*surface|tool_registry|public_surface)'; then
            RISK="HIGH"
          elif echo "$CHANGED" | grep -qE '(src/|core/|internal/|engine/|kernel/)'; then
            RISK="MEDIUM"
          fi
          echo "risk_class=$RISK" >> "$GITHUB_OUTPUT"
          echo "reversibility=REVERSIBLE" >> "$GITHUB_OUTPUT"

  # ── Lint ─────────────────────────────────────────────────────────
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    needs: [classify]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install lint deps
        run: pip install ruff
      - name: Lint
        run: ${{ inputs.lint_command }}

  # ── Type Check ───────────────────────────────────────────────────
  type-check:
    name: "Type Check"
    runs-on: ubuntu-latest
    needs: [classify]
    timeout-minutes: 5
    if: ${{ inputs.type_check_command != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install
        run: ${{ inputs.install_command }}
      - name: Type check
        run: ${{ inputs.type_check_command }}

  # ── Test ─────────────────────────────────────────────────────────
  test:
    name: "Test"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install
        run: ${{ inputs.install_command }}
      - name: Test
        run: |
          set -o pipefail
          ${{ inputs.test_command }}

  # ── Build ────────────────────────────────────────────────────────
  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install build deps
        run: pip install build
      - name: Install
        run: ${{ inputs.install_command }}
      - name: Build package
        run: python -m build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.organ }}-dist
          path: ${{ inputs.artifact_path }}
          retention-days: 7

  # ── Organ Boundary Check ─────────────────────────────────────────
  boundary:
    name: "Organ Boundary"
    runs-on: ubuntu-latest
    needs: [classify]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate organ.yaml
        run: |
          if [ ! -f organ.yaml ]; then
            echo "⚠ No organ.yaml — boundary check skipped"
            exit 0
          fi
          pip install pyyaml 2>/dev/null || true
          python3 -c "
          import yaml, sys
          with open('organ.yaml') as f:
              doc = yaml.safe_load(f)
          required = ['schema_version', 'organ', 'repo', 'role', 'authority_ceiling']
          missing = [k for k in required if k not in doc]
          if missing:
              print(f'❌ organ.yaml missing required keys: {missing}')
              sys.exit(1)
          print(f'✅ organ.yaml valid — {doc[\"organ\"]} ({doc[\"role\"]})')
          "

  # ── Report ───────────────────────────────────────────────────────
  report:
    name: "CI Report"
    runs-on: ubuntu-latest
    needs: [lint, test, build, boundary]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Summary
        run: |
          echo "## ${{ inputs.organ }} CI Results"
          echo "| Job | Result |"
          echo "|-----|--------|"
          echo "| lint | ${{ needs.lint.result }} |"
          echo "| test | ${{ needs.test.result }} |"
          echo "| build | ${{ needs.build.result }} |"
          echo "| boundary | ${{ needs.boundary.result }} |"
