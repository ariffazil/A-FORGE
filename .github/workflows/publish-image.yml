name: Publish A-FORGE Bridge Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: a-forge-image-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Ensure ghcr.io package is public so Actions runners can push blobs.
      # User packages: PATCH via users endpoint not available in gh cli,
      # so we use the GitHub API directly with owner password grant.
      - name: Ensure container package is public
        run: |
          GH_API="https://api.github.com/users/ariffazil/packages/container/a-forge"
          CURRENT=$(gh api "$GH_API" --jq '.visibility' 2>/dev/null)
          if [ "$CURRENT" = "private" ]; then
            echo "Package is private — switching to public visibility"
            # Try org-level PATCH (works for some package types)
            gh api --method PATCH \
              "https://api.github.com/orgs/ariffazil/packages/container/ariffazil%2Fa-forge" \
              -f visibility=public 2>/dev/null && echo "✓ Made public via org PATCH" && return
            # Fallback: use PAT with packages:write scope to update visibility
            gh api --method PATCH "$GH_API" -f visibility=public \
              --header "Accept: application/vnd.github+json" 2>/dev/null \
              && echo "✓ Made public via user PATCH" && return
            echo "⚠ Could not auto-publicise — you may need to set manually:"
            echo "   https://github.com/users/ariffazil/packages/container/a-forge/settings"
          else
            echo "Package visibility: $CURRENT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ariffazil/a-forge:${{ steps.vars.outputs.short_sha }}
            ghcr.io/ariffazil/a-forge:${{ github.event.repository.default_branch }}
            ghcr.io/ariffazil/a-forge:latest
