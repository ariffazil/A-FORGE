name: Publish A-FORGE Bridge Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: a-forge-image-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Ensure ghcr.io package is public so Actions runners can push blobs.
      - name: Ensure container package visibility
        run: |
          set +e  # Don't exit on error — we handle failures gracefully
          GH_API="https://api.github.com/users/ariffazil/packages/container/a-forge"
          CURRENT=$(gh api "$GH_API" --jq '.visibility' 2>/dev/null)
          echo "Package current visibility: ${CURRENT:-not found}"
          if [ "$CURRENT" = "private" ]; then
            echo "Package is private — attempting to make public..."
            # ghcr.io requires explicit public visibility for some Actions operations
            gh api --method PATCH \
              "https://api.github.com/orgs/ariffazil/packages/container/ariffazil%2Fa-forge" \
              -f visibility=public 2>/dev/null && echo "✓ Package set to public" && exit 0
            echo "Note: Could not auto-publicise. If push fails, set manually:"
            echo "  https://github.com/users/ariffazil/packages/container/a-forge/settings"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ariffazil/a-forge:${{ steps.vars.outputs.short_sha }}
            ghcr.io/ariffazil/a-forge:${{ github.event.repository.default_branch }}
            ghcr.io/ariffazil/a-forge:latest
