# ESCAPE HATCH — Survival LiteLLM (2026-08-09)
# Arif directive: transparent failover without agent reconfiguration.
# When FED (:4001) dies, HAProxy routes here (:4002) automatically.
# No Tailscale. Localhost only. Minimal providers for maximum reliability.

model_list:
  # HERMES — Telegram chat
  - model_name: hermes-asi
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      order: 1
  - model_name: hermes-asi
    litellm_params:
      model: openai/mimo-v2.5
      api_base: https://token-plan-sgp.xiaomimimo.com/v1
      api_key: os.environ/MIMO_API_KEY
      order: 2

  # 333-AGI — reasoning
  - model_name: agi-333
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY

  # OpenCode — coding
  - model_name: opencode
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY

  # 555-ASI — research
  - model_name: asi-555
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY

  # 888-APEX — constitutional judge
  - model_name: apex-888
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY

  # Dispatch + OpenClaw
  - model_name: dispatch
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: openclaw
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  telemetry: false
  drop_params: true
  num_retries: 1
  request_timeout: 60

general_settings:
  disable_master_key_return: true
