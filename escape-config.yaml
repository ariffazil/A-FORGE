model_list:
- model_name: escape-gemini
  litellm_params:
    model: openai/gemini-2.5-flash
    api_base: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: os.environ/GEMINI_API_KEY
    order: 1
  model_info:
    max_input_tokens: 1048576
    max_output_tokens: 65536
    mode: chat
    supports_vision: true
    notes: ESCAPE HATCH — Gemini 2.5 Flash. Always free. Survives when everything else dies.
- model_name: escape-gemini
  litellm_params:
    model: openai/gemini-3.6-flash
    api_base: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: os.environ/GEMINI_API_KEY
    order: 2
  model_info:
    max_input_tokens: 1048576
    max_output_tokens: 65536
    mode: chat
    supports_vision: true
    notes: ESCAPE HATCH — Gemini 3.6 Flash fallback. Latest, fast.
- model_name: glm-5.2
  litellm_params:
    model: openai/glm-5.2
    api_base: os.environ/ZAI_API_BASE
    api_key: os.environ/ZAI_API_KEY
    order: 1
  model_info:
    max_input_tokens: 1048576
    max_output_tokens: 131072
    mode: chat
    supports_function_calling: true
    supports_vision: false
    supports_prompt_caching: true
    supports_web_search: true
    metadata:
      zai_capabilities: [thinking-mode, deep-thinking, streaming, stream-tool, function-calling, context-cache, structured-output, web-search]
      zai_endpoint: coding-plan
      zai_default_thinking: dynamic
      zai_reasoning_effort_default: max
    notes: 'Z.ai GLM-5.2 via Coding Plan Pro — F13 ZEN 2026-08-12. model_name=zai-pro resolves to upstream glm-5.2. Coding endpoint: https://api.z.ai/api/coding/paas/v4. 8 capabilities live. Sovereignty caveat: US Entity List + PRC infra. NOTE: litellm model_group routing for zai-pro returns 404; work around is to add model_group_alias mapping zai-pro→glm-5.2 (planned fix).'
litellm_settings:
  num_retries: 2
  cooldown_time: 60
  drop_params: true
router_settings:
  routing_strategy: usage-based-routing
  model_group_alias:
    zai-pro: glm-5.2
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: postgresql://arifos_admin:ArifPostgres2026!@127.0.0.1:5432/litellm
  drop_params: true
