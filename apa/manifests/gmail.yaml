# APA Manifest: Gmail (OAuth Google API)
# ZEN-MIGRATED 2026-08-03 — extracted from arifOS kernel google_workspace.py
connector:
  name: gmail
  mcp_tool: forge_gmail
  version: "2.0.0"
  domain: communication.email
  protocol: google-api
  provider: google
  auth:
    method: oauth_refresh
    token_file: /root/HERMES/google_token.json       # ⚠️ MUST BE PROVISIONED — run Google OAuth flow
    client_secret_file: /root/HERMES/google_client_secret.json  # ⚠️ MUST BE PROVISIONED
  scopes:
    - https://www.googleapis.com/auth/gmail.modify
    - https://www.googleapis.com/auth/gmail.send

verbs:
  - name: search
    class: OBSERVE
    blast_radius: LOW
    description: Search inbox with Gmail query syntax (e.g. 'is:unread', 'from:boss@example.com')
    requires_lease: false
  - name: read
    class: OBSERVE
    blast_radius: LOW
    description: Read a specific email by ID. Supports compact mode for token efficiency.
    requires_lease: false
  - name: read_unread
    class: OBSERVE
    blast_radius: LOW
    description: Read unread emails with optional Gmail query filter. Returns flattened headers (subject, from, date).
    requires_lease: false
  - name: draft_create
    class: MUTATE
    blast_radius: LOW
    reversible: true
    description: Create a draft email (does not send)
    requires_lease: true
    lease_scope: email.mutate
  - name: draft_update
    class: MUTATE
    blast_radius: LOW
    reversible: true
    description: Update an existing draft
    requires_lease: true
    lease_scope: email.mutate
  - name: draft_send
    class: MUTATE
    blast_radius: LOW
    reversible: true
    description: Send an existing draft
    requires_lease: true
    lease_scope: email.send
  - name: draft_delete
    class: MUTATE
    blast_radius: LOW
    reversible: false
    description: Delete a draft
    requires_lease: true
    lease_scope: email.mutate
  - name: modify_labels
    class: MUTATE
    blast_radius: LOW
    reversible: true
    description: Add/remove labels (archive, star, mark read)
    requires_lease: true
    lease_scope: email.mutate
  - name: send
    class: IRREVERSIBLE
    blast_radius: HIGH
    reversible: false
    description: Send an email. Requires full gate stack — signed session, scoped lease, sovereign ACK per payload, independent witness, post-action receipt.
    requires_lease: true
    requires_ack: true
    requires_witness: true
    lease_scope: email.send
    lease_ttl: 300

leases:
  - scope: email.read
    verbs: [search, read, read_unread]
    note: "OBSERVE — no lease required"
  - scope: email.mutate
    verbs: [draft_create, draft_update, draft_delete, modify_labels]
    ttl_default: 3600
  - scope: email.send
    verbs: [draft_send, send]
    ttl_default: 300
    note: "IRREVERSIBLE — short TTL + ACK + WITNESS + capability membrane"

gates:
  pre_execute: [F1_AMANAH, F2_TRUTH, F8_GENIUS]
  pre_mutate: [F1_AMANAH, F13_SOVEREIGN]
  pre_irreversible: [F1_AMANAH, F3_TRI_WITNESS, F11_AUDIT, F13_SOVEREIGN]
  post_execute: [F11_AUDIT, F4_CLARITY]

# Capability membrane for send: exact recipient, subject hash, body hash, expiry, one-time use
capability_membrane:
  enforce: true
  fields: [to, subject_hash, body_hash, expiry_epoch, one_time_use]
  description: "Rich context for understanding. Narrow capability for action."

envelope:
  required_fields: [ok, connector, verb, verdict, evidence_tag, confidence, receipt.timestamp]
