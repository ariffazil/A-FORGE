# Test invariants
invariants:
  - name: alias_output_bytewise_match
    description: "alias output must equal canonical output except alias metadata"
    test_class: tests.alias_parity.test_all_deprecated_aliases
  - name: alias_emits_deprecation_warning_after_expires
    description: "after expires_at, alias emits deprecation warning"
    test_class: tests.alias_parity.test_warning_after_expires
  - name: alias_routes_to_canonical
    description: "alias routes 100% of calls to canonical tool"
    test_class: tests.alias_parity.test_alias_routing

# Hard floor
hard_invariant: |
  No deprecated name may mutate behavior. Alias is a thin pointer.
  If alias logic diverges from canonical, VOID.
