# A-THINK v1 — Hard Budgets
# ==========================
#
# These are hard limits. Not suggestions.
# The agent MUST stop when any budget is hit.
#
# Anti-bangang: Do not increase budgets to "improve" answers.
# If the budget is too small, the task probably needs a different mode.

budgets:
  FAST:
    max_steps: 1
    max_tools: 0
    max_agents: 1
    max_time_seconds: 10
    memory: false
    receipt: false
    human_gate: false

  THINK:
    max_steps: 5
    max_tools: 2
    max_agents: 1
    max_time_seconds: 60
    memory: optional
    receipt: optional
    human_gate: false

  GOVERN:
    max_steps: 9
    max_tools: 5
    max_agents: 3
    max_time_seconds: 180
    memory: true
    receipt: true
    human_gate: true
