  purpose: "Ephemeral Tool Genesis — the capability metabolism engine. Generates TEMPORARY tools from templates for one mission, then dissolves.  9 MODES (default lifecycle: inspect_gap → generate → sandbox_test → invoke → verify → retire):   • inspect_gap        — Detect what capability is missing (use first).   • generate           — Create ephemeral tool from a template.   • sandbox_test       — Verify in bwrap-backed sandbox (fail-closed if no backend).   • invoke             — Execute the ephemeral tool (sandboxed).   • verify             — Independent verification. SELF_CERTIFIED is INADMISSIBLE.                          Accepted methods: known_answer | schema_invariant |                          independent_recompute | domain_witness.   • retire             — Cleanup. Temporary capability is REMOVED unless promoted.   • list_templates     — Browse the template registry.   • list_active        — List currently-active ephemeral tools + cleanup expired.   • propose_promotion  — Mark a template as recommended (after threshold + F13).  EVIDENCE & PROMOTION (P0.3 + F13):   • A tool becomes permanent ONLY if: it survives sandbox_test, invoke, AND     an independent verify, AND the template reaches promotionThreshold, AND     F13 SOVEREIGN ratifies the proposal.   • SELF_CERTIFIED verification is REJECTED as inadmissible for promotion.  CONTAINMENT (P0.4 — fail-closed):   • sandbox_test / invoke use the bwrap-backed ExecutionSandbox.   • No backend → tool state becomes 'failed' (NOT a green skip).  USE WHEN: 'I need to do X but no tool exists' — the federation synthesizes capability on demand. After the mission, retire it. Capability was metabolized, not accumulated."
