# A-THINK v1 — MCP Affordance Cards
# ===================================
#
# WAJIB 2: Every tool must have an affordance card.
# HARAM 1: UNKNOWN = HOLD.
#
# If any field is missing or unknown → tool is HOLD for GOVERN mode.
#
# Risk labels (SUNAT 3):
#   R0: read_only
#   R1: local_temp_write
#   R2: repo_write
#   R3: external_api_write
#   R4: public_publish
#   R5: destructive_or_irreversible
#
# DITEMPA BUKAN DIBERI.

tools:

  # ── arifOS kernel (8088) ───────────────────────────────────────────────

  - name: arif_init
    purpose: Initialize constitutional session
    reads: [session_state]
    writes: [session_state]
    external_side_effect: false
    destructive: false
    reversible: true
    requires_human_approval: false
    min_mode: THINK
    risk_label: R1

  - name: arif_observe
    purpose: Observe and classify evidence
    reads: [evidence, claims]
    writes: []
    external_side_effect: false
    destructive: false
    reversible: true
    requires_human_approval: false
    min_mode: THINK
    risk_label: R0

  - name: arif_think
    purpose: Reason over plans and evidence
    reads: [plans, evidence, claims]
    writes: []
    external_side_effect: false
    destructive: false
    reversible: true
    requires_human_approval: false
    min_mode: THINK
    risk_label: R0

  - name: arif_judge_deliberate
    purpose: Constitutional judgment on proposals
    reads: [proposals, evidence, floors]
    writes: [verdict]
    external_side_effect: false
    destructive: false
    reversible: false
    requires_human_approval: false
    min_mode: GOVERN
    risk_label: R2

  - name: arif_seal
    purpose: Seal verdict to VAULT999 (irreversible)
    reads: [verdict]
    writes: [vault999]
    external_side_effect: false
    destructive: false
    reversible: false
    requires_human_approval: true
    min_mode: GOVERN
    risk_label: R5

  # ── A-FORGE (7072) ────────────────────────────────────────────────────

  - name: forge_shell
    purpose: Execute shell command (governed)
    reads: [filesystem]
