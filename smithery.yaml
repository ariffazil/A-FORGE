# A-FORGE — Smithery MCP Registry Configuration
# Public manifest for Smithery marketplace
# DITEMPA BUKAN DIBERI
#
# THIS FILE IS THE A-FORGE public-facing manifest.
# A-FORGE is the TypeScript execution substrate for the arifOS federation.
# It provides build, deploy, release, rollback, and health tools.
#
# Registry: https://smithery.ai
# Homepage: https://arif-fazil.com

name: A-FORGE-execution-substrate
version: "2026.06.06"
display_name: "A-FORGE — Governed Execution Substrate"
description: |
  A-FORGE is the constitutional execution engine for the arifOS federation.
  Provides build, deploy, release, rollback, and operational health tools.
  All execution is gated by 888_JUDGE verdict and requires sovereign ack.
  arifOS owns final judgment. A-FORGE executes only after SEAL.

category: devops
subcategory: deployment

# MCP protocol
mcp_version: "2024-11-05"
transport: stdio
command: node
args: ["dist/src/interfaces/mcp/server.js"]

# Installation
install:
  method: npm
  package: a-forge
  source: https://github.com/ariffazil/A-FORGE
  node_version: ">=22.0.0"

# A-FORGE execution tools
# These are the MCP tools exposed via stdio transport
tools:
  - id: forge_check_governance
    name: forge_check_governance
    description: |
      Run F3/F6/F9 constitutional checks before execution.
      Returns PASS/HOLD/VOID per floor.
    input_schema:
      type: object
      properties:
        intent:
          type: string
        domain:
          type: string
      required: [intent]

  - id: forge_health
    name: forge_health
    description: |
      Server health check — returns floor implementation status,
      service uptime, and governance surface state.
    input_schema:
      type: object
      properties: {}

  - id: forge_run
    name: forge_run
    description: |
      Execute a governed agent task (explore profile).
      Requires prior 888_JUDGE SEAL. Dry-run mode available.
    input_schema:
      type: object
      properties:
        goal:
          type: string
        mode:
          type: string
          enum: [internal, external]
          default: external
        cwd:
          type: string
        intent_model:
          type: string
          enum: [informational, advisory, execution, speculative]
        risk_level:
          type: string
          enum: [low, medium, high, critical]
      required: [goal]

  - id: forge_hold
    name: forge_hold
    description: |
      Stage an action for 888_HOLD approval.
      Returns ticket ID for tracking.
    input_schema:
      type: object
      properties:
        action:
          type: string
        intent:
          type: string
        risk_level:
          type: string
          enum: [low, medium, high, critical]
      required: [action, intent]

  - id: forge_approve
    name: forge_approve
    description: |
      Approve a held action by ticket ID.
      Only sovereign (Arif) or authorized operator can approve.
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
      required: [ticket_id]

  - id: forge_route_approval
    name: forge_route_approval
    description: |
      Route a PlannerOutput through policy gates.
      Returns AUTO_APPLIED, WAITING_FOR_HUMAN, or REJECTED.
    input_schema:
      type: object
      properties:
        planner_output:
          type: object
      required: [planner_output]

  - id: forge_apply_patches
    name: forge_apply_patches
    description: |
      Apply unified diffs/patches directly.
      Requires prior SEAL. No autonomous execution.
    input_schema:
      type: object
      properties:
        patches:
          type: array
          items: { type: string }
      required: [patches]

  - id: forge_remember
    name: forge_remember
    description: |
      Store a memory in the MemoryContract (5-tier governed memory).
      Tier: ephemeral | working | canon | sacred | quarantine.
    input_schema:
      type: object
      properties:
        content:
          type: string
        tier:
          type: string
          enum: [ephemeral, working, canon, sacred, quarantine]
        pin:
          type: boolean
          default: false
      required: [content, tier]

  - id: forge_recall
    name: forge_recall
    description: |
      Query memories from the MemoryContract.
      Supports full-text search within tier.
    input_schema:
      type: object
      properties:
        query:
          type: string
        tier:
          type: string
          enum: [ephemeral, working, canon, sacred, quarantine]
        limit:
          type: integer
          default: 10
      required: [query]

  - id: forge_ticket_status
    name: forge_ticket_status
    description: |
      Query an approval ticket by ID.
      Returns current status: PENDING | APPROVED | REJECTED | EXPIRED.
    input_schema:
      type: object
      properties:
        ticket_id:
          type: string
      required: [ticket_id]

  - id: forge_seal_service
    name: forge_seal_service
    description: |
      VAULT999 plan-level validation on PlanDAG nodes.
      Append-only seal for terminal verdicts.
    input_schema:
      type: object
      properties:
        verdict:
          type: string
          enum: [SEAL, HOLD, SABAR, VOID]
        session_id:
          type: string
        plan_dag:
          type: object
      required: [verdict]

# Constitutional governance
governance:
  floors:
    - id: F1
      name: Amanah
      description: Reversibility — rollback plan required for all deploys
    - id: F3
      name: Input Clarity
      description: Intent must be explicit before execution
    - id: F4
      name: Entropy
      description: Operational entropy must decrease
    - id: F6
      name: Harm Dignity
      description: Dignity impact assessed before deploy
    - id: F7
      name: Confidence
      description: Confidence band honest — no overclaiming
    - id: F8
      name: Grounding
      description: Evidence grounding required
    - id: F9
      name: Anti-Hantu
      description: No consciousness or emotion claims
    - id: F11
      name: Coherence
      description: Response coherence validated
    - id: F13
      name: Sovereign
      description: Human veto active — 888_HOLD circuit breaker

# Authority exclusions
authority:
  owns:
    - build_release
    - deploy_health
    - rollback_plan
    - ops_cost
    - execution_receipts
  excludes:
    - constitutional_judgment
    - domain_truth
    - geological_evidence
    - capital_allocation
    - biological_diagnosis
    - final_seal
  human_sovereign: Muhammad Arif bin Fazil
  final_verdict: arifOS 888_JUDGE

# Hold conditions
hold_conditions:
  - deploy_without_build_test_health
  - missing_rollback_path
  - secret_or_env_change
  - irreversible_host_mutation
  - high_critical_risk_unacknowledged

# Author
author:
  name: Muhammad Arif bin Fazil
  email: ariffazil@gmail.com
  github: https://github.com/ariffazil

license: AGPL-3.0
links:
  github: https://github.com/ariffazil/A-FORGE

