[identity]
canonical_name = "A-FORGE Agent Runtime"
short_name = "A-FORGE"
service_id = "a-forge-mcp"
version = "kanon-1.0.0"
authority = "F13_SOVEREIGN"

[network]
sense_port = 7071
mcp_port = 7072
caddy_domain = "forge.arif-fazil.com"
a2a_enabled = true

[capabilities]
roles = ["Forge", "Execution", "Agent Runtime"]
floors_enforced = ["F1", "F2", "F4", "F5", "F7", "F11", "F12", "F13"]
floors_delegated_to_arifos = ["F3", "F6", "F8", "F9", "F10"]

[security]
vault999_attestation_required = true
openclaw_routed = true


[identity_hash]
algorithm = "BLAKE3"
source = "identity.toml"
embedded_in_health = true
chain_upstream = "arifOS"
