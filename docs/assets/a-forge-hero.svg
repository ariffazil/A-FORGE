<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a6270"/>
    </marker>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#fade)"/>
  <g stroke="#232830" stroke-width="1">
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="470" x2="1280" y2="470"/>
  </g>

  <!-- Title -->
  <text x="60" y="104" fill="#f2f4f7" font-size="58" font-weight="700">A-FORGE</text>
  <text x="60" y="146" fill="#e07b39" font-size="22" letter-spacing="5">EXECUTION WITHOUT SELF-AUTHORIZATION</text>
  <text x="1220" y="104" fill="#9aa4b2" font-size="16" text-anchor="end">the hands never judge</text>

  <!-- Flow cards -->
  <g>
    <rect x="52" y="320" width="195" height="110" rx="14" fill="#1d2229" stroke="#4fd1c5" stroke-width="2"/>
    <text x="149" y="366" fill="#f2f4f7" font-size="19" font-weight="700" text-anchor="middle">AUTHORIZED</text>
    <text x="149" y="394" fill="#9aa4b2" font-size="15" text-anchor="middle">intent + lease</text>

    <rect x="297" y="308" width="195" height="134" rx="14" fill="#241d16" stroke="#e07b39" stroke-width="2.5"/>
    <text x="394" y="352" fill="#e07b39" font-size="21" font-weight="700" text-anchor="middle">BOUNDARY</text>
    <text x="394" y="380" fill="#e07b39" font-size="21" font-weight="700" text-anchor="middle">GATES</text>
    <text x="394" y="410" fill="#9aa4b2" font-size="13" text-anchor="middle">action class · budget · scan</text>

    <rect x="542" y="320" width="195" height="110" rx="14" fill="#241d16" stroke="#e07b39" stroke-width="2.5"/>
    <text x="639" y="366" fill="#e07b39" font-size="21" font-weight="700" text-anchor="middle">FORGE</text>
    <text x="639" y="394" fill="#9aa4b2" font-size="15" text-anchor="middle">execution</text>

    <rect x="787" y="320" width="195" height="110" rx="14" fill="#1d2229" stroke="#3fbf7f" stroke-width="2"/>
    <text x="884" y="366" fill="#f2f4f7" font-size="19" font-weight="700" text-anchor="middle">OBSERVED</text>
    <text x="884" y="394" fill="#9aa4b2" font-size="15" text-anchor="middle">consequence</text>

    <rect x="1032" y="320" width="195" height="110" rx="14" fill="#1d2229" stroke="#4fd1c5" stroke-width="2"/>
    <text x="1129" y="366" fill="#f2f4f7" font-size="19" font-weight="700" text-anchor="middle">RECEIPT</text>
    <text x="1129" y="394" fill="#9aa4b2" font-size="15" text-anchor="middle">chain + evidence</text>
  </g>

  <!-- Arrows -->
  <g stroke="#5a6270" stroke-width="2.5" marker-end="url(#ah)">
    <line x1="249" y1="375" x2="291" y2="375"/>
    <line x1="494" y1="375" x2="536" y2="375"/>
    <line x1="739" y1="375" x2="781" y2="375"/>
    <line x1="984" y1="375" x2="1026" y2="375"/>
  </g>

  <!-- Brake: NO AUTHORITY -> NO MUTATION -->
  <g>
    <rect x="297" y="486" width="195" height="58" rx="12" fill="#3a1a1a" stroke="#d9534f" stroke-width="2.5"/>
    <rect x="313" y="504" width="22" height="22" rx="4" fill="none" stroke="#d9534f" stroke-width="3"/>
    <line x1="316" y1="507" x2="332" y2="523" stroke="#d9534f" stroke-width="3"/>
    <line x1="332" y1="507" x2="316" y2="523" stroke="#d9534f" stroke-width="3"/>
    <text x="410" y="512" fill="#d9534f" font-size="15" font-weight="700" text-anchor="middle">NO AUTHORITY</text>
    <text x="410" y="533" fill="#d9534f" font-size="15" font-weight="700" text-anchor="middle">→ NO MUTATION</text>
    <line x1="394" y1="442" x2="394" y2="484" stroke="#d9534f" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="640" y="524" fill="#9aa4b2" font-size="15">a tested unauthorised MUTATE-class call was refused (measured 2026-10-11)</text>
  </g>

  <!-- Footer -->
  <text x="60" y="606" fill="#9aa4b2" font-size="17">Capability is not permission. The hands never judge.</text>
  <text x="1220" y="606" fill="#e07b39" font-size="16" letter-spacing="3" text-anchor="end">DITEMPA BUKAN DIBERI</text>
</svg>
